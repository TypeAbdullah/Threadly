<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threadly Embeddable Widget Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #09090b;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .demo-bar {
      max-width: 860px;
      margin: 0 auto 24px auto;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .demo-title {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo-badge {
      background: #f43f5e;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .scenario-tabs {
      display: flex;
      gap: 8px;
    }
    .scenario-tab {
      background: #27272a;
      border: none;
      color: #a1a1aa;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .scenario-tab.active {
      background: #ffffff;
      color: #09090b;
    }
    .content-wrapper {
      max-width: 860px;
      margin: 0 auto;
    }
    .mock-host-page {
      background: #121214;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .mock-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .mock-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .mock-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }
    .mock-meta {
      font-size: 13px;
      color: #71717a;
    }
    .mock-body {
      font-size: 15px;
      line-height: 1.7;
      color: #d4d4d8;
      border-bottom: 1px solid #27272a;
      padding-bottom: 24px;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>

  <!-- Top Demo Controller Bar -->
  <div class="demo-bar">
    <div class="demo-title">
      <span>Threadly Commenting Embed</span>
      <span class="demo-badge">Live Demo</span>
    </div>
    <div class="scenario-tabs">
      <button class="scenario-tab active" data-site="mist-scans" data-page="lookism-500" data-title="Lookism Chapter 500" data-type="manga">
        📖 Manga Reader
      </button>
      <button class="scenario-tab" data-site="example-blog" data-page="my-first-post" data-title="My First Blog Post" data-type="blog">
        📝 Blog Post
      </button>
      <button class="scenario-tab" data-site="tech-news" data-page="ai-breakthrough" data-title="Next-Gen AI Systems" data-type="news">
        📰 News Article
      </button>
    </div>
  </div>

  <div class="content-wrapper">
    <!-- Simulated External Host Page -->
    <div class="mock-host-page" id="host-page-preview">
      <div class="mock-header">
        <div class="mock-logo" id="host-logo">🐉</div>
        <div>
          <h1 class="mock-title" id="host-title">Lookism - Chapter 500</h1>
          <div class="mock-meta" id="host-meta">Site: Mist Scans • URL: https://mistscans.com/read/lookism/500</div>
        </div>
      </div>
      <div class="mock-body" id="host-body">
        <p>The epic battle between Allied and Workers reaches its climax at the 1st Affiliate! Fans have been waiting for this showdown for months...</p>
      </div>

      <!-- Threadly Widget Embedded Container -->
      <div id="threadly-embed"></div>
    </div>
  </div>

  <!-- Load Widget Script -->
  <script type="module">
    import { Threadly } from "./src/index.ts";

    // Initialize Threadly on default scenario
    let activeSite = "mist-scans";
    let activePage = "lookism-500";

    function mountThreadly(siteId, pageId) {
      Threadly.init({
        siteId: siteId,
        pageId: pageId,
        container: "#threadly-embed",
        apiUrl: "http://localhost:3000",
        theme: "dark"
      });
    }

    mountThreadly(activeSite, activePage);

    // Scenario tab switcher
    document.querySelectorAll(".scenario-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".scenario-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        const site = tab.dataset.site;
        const page = tab.dataset.page;
        const title = tab.dataset.title;
        const type = tab.dataset.type;

        const hostTitle = document.getElementById("host-title");
        const hostMeta = document.getElementById("host-meta");
        const hostLogo = document.getElementById("host-logo");
        const hostBody = document.getElementById("host-body");

        if (type === "manga") {
          hostLogo.textContent = "🐉";
          hostTitle.textContent = title;
          hostMeta.textContent = `Site: Mist Scans • URL: https://mistscans.com/read/${page}`;
          hostBody.innerHTML = "<p>The epic battle between Allied and Workers reaches its climax at the 1st Affiliate!</p>";
        } else if (type === "blog") {
          hostLogo.textContent = "✍️";
          hostTitle.textContent = title;
          hostMeta.textContent = `Site: Example Blog • URL: https://example.com/posts/${page}`;
          hostBody.innerHTML = "<p>Welcome to my personal blog. Today I want to reflect on web architecture and distributed systems.</p>";
        } else {
          hostLogo.textContent = "📰";
          hostTitle.textContent = title;
          hostMeta.textContent = `Site: Tech News • URL: https://news.example.com/article/${page}`;
          hostBody.innerHTML = "<p>Breaking: Major innovations in generative AI models and localized embedded computing.</p>";
        }

        mountThreadly(site, page);
      });
    });
  </script>
</body>
</html>
