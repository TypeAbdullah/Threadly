services:
  mongodb:
    image: mongo:7.0
    container_name: threadly-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: threadly
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: threadly-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/threadly
      BETTER_AUTH_SECRET: dev_super_secret_better_auth_key_12345
      BETTER_AUTH_URL: http://localhost:3000
      CLIENT_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      WIDGET_URL: http://localhost:5175
    depends_on:
      - mongodb

volumes:
  mongo_data:
